<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpBench HUD · Performance</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header><a class="brand" href="#dashboard"><span class="logo">O</span> OpBench HUD <small>INTERNAL</small></a><nav aria-label="主导航"><button data-page="dashboard" class="active">基准测试</button><button data-page="runs">运行记录</button><button data-page="devices">设备</button><button data-page="templates">测试模板</button><button data-page="docs">文档</button></nav><span class="connection"><i></i> SQLite 数据服务</span><button id="auth" title="设置 API 访问令牌">访问令牌</button><button id="language">EN</button></header>
<aside id="sidebar"><div class="aside-title">搜索与筛选 <button id="reset">↺ 清零</button></div><input id="search" type="search" placeholder="搜索模型或形状" aria-label="搜索模型或形状"><label>算子分类<select id="category"><option value="">全部分类</option></select></label><label>硬件<select id="hardware"><option value="">全部硬件</option></select></label><label>数据类型<select id="dtype"><option value="">全部数据类型</option></select></label><label>模式 / 工作阶段<select id="stage"><option value="">全部阶段</option><option value="forward">前向 forward</option><option value="backward">反向 backward</option><option value="optimizer">优化器更新</option></select></label><label>结果状态<select id="status"><option value="">全部状态</option><option value="paired">双方成功</option><option value="failure">失败 / 不支持</option><option value="missing">缺失匹配</option></select></label><div class="formula"><label>算式过滤<select id="formula"><option value="">不使用算式</option><option value="difference">T_gpu − T_cpu (μs)</option><option value="cpu_ratio">T_cpu / T_gpu</option><option value="gpu_ratio">T_gpu / T_wall</option></select></label><label>应用到<select id="formulaSide"><option value="right">右侧运行</option><option value="left">左侧运行</option></select></label><div class="range"><input id="min" type="number" placeholder="最小值" aria-label="算式最小值"><input id="max" type="number" placeholder="最大值" aria-label="算式最大值"></div></div><div class="upload-box"><strong>基准测试数据</strong><p id="data-count">正在连接服务…</p><label class="primary file-button">选择 JSON 文件<input id="upload" type="file" accept=".json" multiple></label><label class="file-button">选择目录<input id="folder" type="file" webkitdirectory multiple></label><small>结果保存到当前服务的数据库。</small></div></aside>
<main id="main"><section id="dashboard"><div class="hero"><div><div class="eyebrow">PYTORCH 算子微基准测试</div><h1>性能看板</h1><p>对比不同加速器运行中的算子延迟、有效内存带宽和峰值内存。</p></div><div class="actions"><button id="export">导出对比 CSV</button><button class="primary" id="import">＋ 导入结果</button></div></div><div class="run-picker panel"><strong>对比运行</strong><select id="left" aria-label="左侧运行"></select><button id="swap" aria-label="交换左右运行">⇄</button><select id="right" aria-label="右侧运行"></select><small id="run-count"></small></div><div id="warnings" class="notice"></div><div id="summary" class="summary"></div><section class="panel operators"><div class="section-label">算子列表 <small id="selection-count"></small></div><div id="operator-list" class="operator-list"></div></section><section class="panel comparison"><div class="table-title"><div><h2>对比表</h2><p id="comparison-label"></p></div><div class="legend"><span class="green">● 右侧更快</span><span class="blue">● 左侧更快</span></div></div><div id="table-scroll" class="table-scroll"><table id="results"><thead></thead><tbody></tbody></table></div><div class="pagination"><span id="page-label"></span><div><select id="pageSize" aria-label="每页数量"><option>25</option><option selected>50</option><option>100</option></select><button id="previous">上一页</button><span id="page-number"></span><button id="next">下一页</button></div></div></section></section><section id="secondary" hidden></section><footer>OpBench Performance · 可复现的算子微基准 · 指标口径 v1</footer></main>
<div id="toast" role="status" hidden></div><dialog id="details"><div class="dialog-head"><h2>用例详情</h2><button id="close-details">关闭 ×</button></div><div id="detail-content"></div></dialog><dialog id="token-dialog"><h2>API 访问令牌</h2><p>仅保存在当前标签页会话中，不写入结果文件。</p><input id="token-input" type="password" autocomplete="off" aria-label="API 访问令牌"><div class="actions"><button id="cancel-token">取消</button><button class="primary" id="save-token">连接</button></div></dialog>
</body></html>
